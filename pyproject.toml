[project]
name = "agentifyapi"
dynamic = ["version"]
description = "Make your FastAPI services agent-ready with owner-approved MCP tools."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Somil Aggarwal" }]
keywords = ["mcp", "model-context-protocol", "fastapi", "ai-agents", "llm", "gateway", "openapi", "governance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Typing :: Typed",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "pydantic>=2.6",
  "pyyaml>=6",
  # Stable 1.x line (lowlevel Server + streamable HTTP). 2.x renames APIs; see docs/DESIGN.md.
  "mcp>=1.12,<2",
]

[project.urls]
Homepage = "https://github.com/SomilAgg123/agentifyapi"
Repository = "https://github.com/SomilAgg123/agentifyapi"
Issues = "https://github.com/SomilAgg123/agentifyapi/issues"
Changelog = "https://github.com/SomilAgg123/agentifyapi/blob/main/CHANGELOG.md"

[project.scripts]
agentifyapi = "agentifyapi.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "pyright>=1.1.400", "ruff>=0.6", "pre-commit>=3"]

[project.optional-dependencies]
# kept for `pip install -e ".[dev]"` users without uv
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "pyright>=1.1.400", "ruff>=0.6", "pre-commit>=3"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/agentifyapi"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "--strict-markers --strict-config -ra"
xfail_strict = true
markers = ["integration: starts real servers and talks MCP over HTTP"]

[tool.coverage.run]
source = ["agentifyapi"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.pyright]
include = ["src", "tests", "examples", "scripts"]
typeCheckingMode = "standard"
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # the formatter owns line length; long literals are fine
