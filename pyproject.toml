[project]
name = "mcpify"
version = "0.1.0"
description = "Make your FastAPI services agent-ready with owner-approved MCP tools."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "pydantic>=2.6",
  "pyyaml>=6",
  # Pinned to the stable 1.x line (FastMCP + streamable HTTP). 2.x renames APIs; see docs/DESIGN.md.
  "mcp>=1.12,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
mcpify = "mcpify.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcpify"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]
